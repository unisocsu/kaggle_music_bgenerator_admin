name: Direct song generation (Kaggle GPU)

on:
  workflow_dispatch:
    inputs:
      caption:
        description: "Music style and production description"
        required: true
        type: string
      lyrics:
        description: "Song lyrics"
        required: false
        type: string
      duration:
        description: "Duration in seconds; 0 lets the model choose"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: direct-kaggle-song-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  generate:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate dispatched request
        id: request
        env:
          CAPTION_INPUT: ${{ inputs.caption }}
          LYRICS_INPUT: ${{ inputs.lyrics }}
          DURATION_INPUT: ${{ inputs.duration }}
        run: |
          python - <<'PY'
          import os
          caption = os.environ["CAPTION_INPUT"].strip()
          lyrics = os.environ.get("LYRICS_INPUT", "")
          duration = int(os.environ["DURATION_INPUT"])
          if not caption or len(caption) > 512: raise SystemExit("caption must contain 1-512 characters")
          if len(lyrics) > 4096: raise SystemExit("lyrics must be at most 4096 characters")
          if duration != 0 and not 10 <= duration <= 600: raise SystemExit("duration must be between 10 and 600 seconds")
          import uuid
          delimiter = "ghadelimiter_" + uuid.uuid4().hex
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"caption<<{delimiter}\n{caption}\n{delimiter}\n")
              f.write(f"lyrics<<{delimiter}\n{lyrics}\n{delimiter}\n")
              f.write(f"duration={duration}\n")
          PY

      - name: Report request in workflow summary
        run: |
          {
            echo '## 🎛️ Direct song generation'
            echo '- Request accepted; preparing a private Kaggle GPU kernel.'
            echo '- Inputs: caption, lyrics, duration.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install Kaggle CLI
        run: |
          python -m pip install --upgrade pip
          python -m pip install kaggle

      - name: Create private Kaggle notebook
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          RUN_ID: ${{ github.run_id }}
          CAPTION: ${{ steps.request.outputs.caption }}
          LYRICS: ${{ steps.request.outputs.lyrics }}
          DURATION: ${{ steps.request.outputs.duration }}
        run: |
          test -n "$KAGGLE_USERNAME" || (echo "Missing KAGGLE_USERNAME secret" && exit 1)
          test -n "$KAGGLE_API_TOKEN" || (echo "Missing KAGGLE_API_TOKEN secret" && exit 1)
          mkdir -p kaggle-job
          export KERNEL_SLUG="direct-song-run-$RUN_ID"
          python - <<'PY'
          import json, os
          caption = os.environ["CAPTION"]
          lyrics = os.environ["LYRICS"]
          duration = int(os.environ["DURATION"])
          run_id = int(os.environ["RUN_ID"])
          def markdown_cell(cell_id, text):
              return {"cell_type":"markdown","id":cell_id,"metadata":{},"source":[text]}

          def code_cell(cell_id, lines):
              return {"cell_type":"code","id":cell_id,"execution_count":None,"metadata":{},"outputs":[],"source":lines}

          cells = [
            markdown_cell("intro", "# Direct ACE-Step 1.5 song generation\nPrivate Kaggle GPU kernel. Python 3.12 environment is prepared separately from Kaggle's system Python.\n"),
            code_cell("clone", [
              "!git clone --depth 1 https://github.com/ACE-Step/ACE-Step-1.5.git /kaggle/working/ACE-Step-1.5\n",
              "%cd /kaggle/working/ACE-Step-1.5"
            ]),
            code_cell("install-python312", [
              "!curl -LsSf https://astral.sh/uv/install.sh | sh\n",
              "import os\n",
              "os.environ['PATH'] = os.path.expanduser('~/.local/bin') + ':' + os.environ['PATH']\n",
              "!uv python install 3.12\n",
              "!uv sync --python 3.12 --no-dev\n",
              "! .venv/bin/python -c \"import sys, torch; print('Python:', sys.version); print('PyTorch:', torch.__version__); print('CUDA available:', torch.cuda.is_available()); print('CUDA build:', torch.version.cuda); assert sys.version_info[:2] == (3, 12); assert torch.cuda.is_available(), 'CUDA is unavailable in the Python 3.12 environment'\""
            ]),
            code_cell("write-generation-script", [
              "%%writefile /kaggle/working/run_generation.py\n",
              "import os, shutil, torch\n",
              "from acestep.handler import AceStepHandler\n",
              "from acestep.llm_inference import LLMHandler\n",
              "from acestep.inference import GenerationParams, GenerationConfig, generate_music\n",
              f"CAPTION = {caption!r}\n",
              f"LYRICS = {lyrics!r}\n",
              f"DURATION = {duration!r}\n",
              f"RUN_ID = {run_id!r}\n",
              "assert torch.cuda.is_available(), 'Kaggle GPU is not available'\n",
              "print('GPU:', torch.cuda.get_device_name(0))\n",
              "print('VRAM GiB:', round(torch.cuda.get_device_properties(0).total_memory / 1024**3, 2))\n",
              "dit = AceStepHandler()\n",
              "dit.initialize_service(project_root='/kaggle/working/ACE-Step-1.5', config_path='acestep-v15-turbo', device='cuda')\n",
              "llm = LLMHandler()\n",
              "llm.initialize(checkpoint_dir='/kaggle/working/ACE-Step-1.5/checkpoints', lm_model_path='acestep-5Hz-lm-0.6B', backend='pt', device='cuda')\n",
              "params = GenerationParams(task_type='text2music', caption=CAPTION, lyrics=LYRICS, duration=float(DURATION), thinking=True, inference_steps=8, shift=3.0)\n",
              "config = GenerationConfig(batch_size=1, audio_format='mp3')\n",
              "os.makedirs('/kaggle/working/song-output', exist_ok=True)\n",
              "result = generate_music(dit, llm, params, config, save_dir='/kaggle/working/song-output')\n",
              "if not result.success: raise RuntimeError(result.error or result.status_message)\n",
              "print('Generation status:', result.status_message)\n",
              "for i, audio in enumerate(result.audios):\n",
              "    src = audio['path']\n",
              "    dst = f'/kaggle/working/song-output/song-{i+1}.mp3'\n",
              "    if src != dst: shutil.copy2(src, dst)\n",
              "    print('OUTPUT:', dst)\n",
              "assert os.path.exists('/kaggle/working/song-output/song-1.mp3'), 'No MP3 output was produced'"
            ]),
            code_cell("run-generation", [
              "! /kaggle/working/ACE-Step-1.5/.venv/bin/python /kaggle/working/run_generation.py"
            ])
          ]
          notebook={"cells":cells,"metadata":{"kernelspec":{"display_name":"Python 3","language":"python","name":"python3"},"language_info":{"name":"python"}},"nbformat":4,"nbformat_minor":5}
          with open("kaggle-job/song.ipynb","w") as f: json.dump(notebook,f)
          meta={"id":os.environ["KAGGLE_USERNAME"]+"/"+os.environ["KERNEL_SLUG"],"title":"Direct song run "+str(run_id),"code_file":"song.ipynb","language":"python","kernel_type":"notebook","is_private":True,"enable_gpu":True,"enable_internet":True}
          with open("kaggle-job/kernel-metadata.json","w") as f: json.dump(meta,f,indent=2)
          PY
          printf 'KERNEL_SLUG=%s\n' "$KERNEL_SLUG" >> "$GITHUB_ENV"
          printf 'KERNEL_REF=%s/%s\n' "$KAGGLE_USERNAME" "$KERNEL_SLUG" >> "$GITHUB_ENV"

      - name: Push and run on Kaggle GPU
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          kaggle kernels push -p kaggle-job
          echo "Kaggle kernel submitted: $KERNEL_REF" >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for Kaggle kernel
        id: wait
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set +e
          reported_running=false
          for i in $(seq 1 240); do
            status="$(kaggle kernels status "$KERNEL_REF" 2>&1)"
            echo "$status"
            if [ "$reported_running" = false ] && echo "$status" | grep -qiE 'running|in progress'; then
              echo "Kaggle reports the kernel is running." >> "$GITHUB_STEP_SUMMARY"
              reported_running=true
            fi
            if echo "$status" | grep -qiE 'complete|has completed'; then
              echo "completed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if echo "$status" | grep -qiE 'error|cancelled|failed'; then
              echo "❌ Kaggle kernel failed: $status" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            sleep 30
          done
          echo "⌛ Kaggle did not finish within the workflow wait window." >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Download Kaggle output
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          mkdir -p result
          kaggle kernels output "$KERNEL_REF" -p result
          find result -maxdepth 3 -type f -printf '%p %s bytes\n'
          test -n "$(find result -type f -iname '*.mp3' -print -quit)"

      - name: Publish MP3 release and update workflow summary
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          FILE="$(find result -type f -iname '*.mp3' -print -quit)"
          TAG="direct-song-run-$GITHUB_RUN_ID"
          gh release create "$TAG" "$FILE#Generated song (MP3)" --title "Direct song run $GITHUB_RUN_ID" --notes "Generated on Kaggle GPU with ACE-Step 1.5. GitHub Actions run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$(basename "$FILE")"
          {
            echo "## 🎵 Generation completed"
            echo "[Download the generated MP3]($URL)"
            echo "Release: $TAG"
          } >> "$GITHUB_STEP_SUMMARY"
