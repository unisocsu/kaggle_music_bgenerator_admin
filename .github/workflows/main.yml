
name: Generate music (Kaggle dispatch)

on:
  workflow_dispatch:
    inputs:
      song_title:
        description: Optional project title
        required: false
        default: ""
        type: string
      prompt:
        description: Music description (style, mood, instruments, rhythm and structure)
        required: true
        type: string
      lyrics:
        description: Full lyrics (optional; leave empty for generated lyrics)
        required: false
        default: ""
        type: string
      duration:
        description: Song duration
        required: true
        default: "180"
        type: choice
        options:
          - "120"
          - "180"
          - "240"
          - "300"
      language:
        description: Vocal language
        required: true
        default: he
        type: choice
        options:
          - he
          - en
          - unknown
          - es
          - fr
          - ar
          - yi
      style:
        description: Additional style direction
        required: false
        default: ""
        type: string
      instructions:
        description: Extra generation instructions
        required: false
        default: ""
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: kaggle-music-worker
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Python sources
        run: |
          python -m py_compile scripts/push_music_worker.py kaggle/music_worker.py
      - name: Install Kaggle CLI and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -q kaggle six
          python -c "import kaggle, six; print('Kaggle CLI dependencies OK')"
          kaggle --help > /dev/null
          echo "Kaggle CLI is ready"
      
